<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cobalt Prospect Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #F3F4F2;
    --surface: #FFFFFF;
    --surface-sunk: #ECEDEA;
    --ink: #15171C;
    --ink-soft: #565C68;
    --ink-faint: #8B909B;
    --line: #DDE0E3;
    --cobalt: #0047AB;
    --cobalt-dark: #003580;
    --cobalt-tint: #E7EDF9;
    --amber: #B4750E;
    --amber-tint: #FBF0DD;
    --green: #1B7A43;
    --green-tint: #E4F3E9;
    --red: #A32A2A;
    --red-tint: #F7E7E5;
    --grey-tint: #EEEFEE;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(21,23,28,0.04), 0 8px 24px -12px rgba(21,23,28,0.12);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif; font-feature-settings:'tnum' 1; font-variant-numeric: tabular-nums; }
  .display{ font-family:'Source Serif 4', Georgia, serif; }

  .wrap{ max-width:1280px; margin:0 auto; padding:28px 28px 80px; }

  /* header */
  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:34px; height:34px; border-radius:8px; background:linear-gradient(155deg,var(--cobalt),var(--cobalt-dark));
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Source Serif 4',serif; font-weight:700; font-size:16px; flex-shrink:0; }
  .brand h1{ font-size:20px; margin:0; font-weight:600; letter-spacing:-0.01em; }
  .brand p{ margin:1px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .actions{ display:flex; gap:10px; align-items:center; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:8px;
    font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:border-color .15s, background .15s; }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn-primary{ background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
  .btn-primary:hover{ background:var(--cobalt-dark); border-color:var(--cobalt-dark); }
  .btn-ghost{ border-color:transparent; background:transparent; color:var(--ink-soft); padding:9px 10px; }
  .btn-ghost:hover{ background:var(--surface-sunk); color:var(--ink); }
  .btn-danger{ color:var(--red); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* summary strip */
  .summary{ display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; margin-bottom:20px; }
  .summary .cell{ background:var(--surface); padding:14px 16px; }
  .summary .num{ font-family:'Source Serif 4',serif; font-size:24px; font-weight:600; line-height:1; }
  .summary .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; text-transform:uppercase; letter-spacing:.05em; }
  .summary .num.warn{ color:var(--amber); }
  .summary .num.accent{ color:var(--cobalt); }

  /* weights panel */
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:18px; box-shadow:var(--shadow); }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:13px 18px; cursor:pointer; user-select:none; }
  .panel-head h2{ font-size:13.5px; margin:0; font-weight:600; display:flex; align-items:center; gap:8px; }
  .chev{ transition:transform .15s; color:var(--ink-faint); }
  .chev.open{ transform:rotate(180deg); }
  .panel-body{ padding:4px 18px 18px; display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  .panel-body.collapsed{ display:none; }
  .weight-row label{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:7px; }
  .weight-row label b{ color:var(--ink); font-weight:600; }
  input[type=range]{ width:100%; accent-color:var(--cobalt); }
  .band-row{ grid-column:1 / -1; display:flex; align-items:center; gap:14px; padding-top:6px; border-top:1px dashed var(--line); margin-top:2px; }
  .band-row span{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .band-row input[type=number]{ width:120px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:inherit; }

  /* filter bar */
  .filterbar{ display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .filterbar select, .filterbar input[type=text]{ padding:8px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px;
    font-family:inherit; background:var(--surface); color:var(--ink); }
  .filterbar input[type=text]{ min-width:220px; }
  .filterbar .spacer{ flex:1; }
  .count-pill{ font-size:12px; color:var(--ink-soft); }

  /* table */
  .tablewrap{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);
    padding:11px 14px; background:var(--surface-sunk); border-bottom:1px solid var(--line); font-weight:600; white-space:nowrap; cursor:pointer; }
  thead th:hover{ color:var(--ink); }
  thead th.sorted{ color:var(--cobalt); }
  tbody tr{ border-bottom:1px solid var(--line); }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:#FAFBFC; }
  td{ padding:11px 14px; vertical-align:middle; }
  .owner-name{ font-weight:600; }
  .owner-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }

  .score-cell{ display:flex; align-items:center; gap:8px; min-width:110px; }
  .score-bar{ width:56px; height:6px; border-radius:4px; background:var(--surface-sunk); overflow:hidden; flex-shrink:0; }
  .score-bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--cobalt-dark),var(--cobalt)); }
  .score-num{ font-weight:700; font-size:13px; width:26px; text-align:right; }

  .badge{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
  .badge.yes{ background:var(--green-tint); color:var(--green); }
  .badge.no{ background:var(--grey-tint); color:var(--ink-soft); }
  .badge.entity{ background:var(--cobalt-tint); color:var(--cobalt-dark); }

  select.status-select{ font-size:12.5px; font-weight:600; padding:5px 8px; border-radius:6px; border:1px solid var(--line);
    font-family:inherit; background:var(--surface); }
  select.status-select.st-new{ background:var(--grey-tint); border-color:var(--grey-tint); }
  select.status-select.st-attempted{ background:var(--amber-tint); border-color:var(--amber-tint); color:var(--amber); }
  select.status-select.st-contacted{ background:var(--cobalt-tint); border-color:var(--cobalt-tint); color:var(--cobalt-dark); }
  select.status-select.st-meeting{ background:#DCEBFF; border-color:#DCEBFF; color:var(--cobalt-dark); }
  select.status-select.st-discussion{ background:var(--green-tint); border-color:var(--green-tint); color:var(--green); }
  select.status-select.st-dead{ background:var(--red-tint); border-color:var(--red-tint); color:var(--red); }

  input.touch-date{ font-size:12.5px; padding:5px 7px; border:1px solid var(--line); border-radius:6px; font-family:inherit; width:130px; }
  .overdue{ color:var(--red); font-weight:600; }

  .row-actions{ display:flex; gap:4px; }
  .icon-btn{ background:transparent; border:none; color:var(--ink-faint); padding:5px; border-radius:6px; display:flex; }
  .icon-btn:hover{ background:var(--surface-sunk); color:var(--ink); }

  .notes-row td{ background:#FAFBFC; padding:0 14px 14px; }
  .notes-row textarea{ width:100%; min-height:56px; border:1px solid var(--line); border-radius:8px; padding:9px 11px;
    font-family:inherit; font-size:12.5px; resize:vertical; }
  .notes-row .save-note{ margin-top:6px; }

  .empty{ text-align:center; padding:70px 20px; color:var(--ink-soft); }
  .empty .display{ font-size:22px; color:var(--ink); margin-bottom:8px; }
  .empty p{ max-width:420px; margin:0 auto 18px; font-size:13.5px; line-height:1.5; }

  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(21,23,28,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal{ background:var(--surface); border-radius:14px; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px -20px rgba(0,0,0,0.35); }
  .modal-head{ padding:20px 24px 4px; }
  .modal-head h2{ font-size:18px; margin:0 0 4px; }
  .modal-head p{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .modal-body{ padding:14px 24px 20px; }
  .map-row{ display:grid; grid-template-columns:170px 1fr; gap:12px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); }
  .map-row:last-of-type{ border-bottom:none; }
  .map-row label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .map-row label span{ display:block; font-weight:400; color:var(--ink-faint); font-size:11px; margin-top:1px; }
  .map-row select, .map-row input[type=text]{ padding:7px 9px; border:1px solid var(--line); border-radius:7px; font-size:12.5px; font-family:inherit; width:100%; }
  .modal-foot{ display:flex; justify-content:space-between; align-items:center; padding:14px 24px 22px; gap:10px; }
  .field-block{ margin-bottom:14px; }
  .field-block label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; }
  .field-block input{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; font-family:inherit; }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px;
    border-radius:8px; font-size:12.5px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  #fileInput{ display:none; }
  ::selection{ background:var(--cobalt-tint); }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <h1 class="display">Cobalt Prospect Engine</h1>
        <p>Owner-direct outreach, scored and tracked</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost btn-danger" id="clearBtn">Clear all data</button>
      <button class="btn btn-ghost" id="importBackupBtn">Import backup</button>
      <button class="btn btn-ghost" id="exportBackupBtn">Export backup</button>
      <button class="btn btn-primary" id="uploadBtn">Upload CSV export</button>
      <input type="file" id="fileInput" accept=".csv">
      <input type="file" id="backupInput" accept=".json">
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="panel">
    <div class="panel-head" id="panelHead">
      <h2>Scoring weights</h2>
      <svg class="chev open" id="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="weight-row">
        <label>Ownership tenure <b id="wTenureVal">25</b></label>
        <input type="range" min="0" max="100" value="25" id="wTenure">
      </div>
      <div class="weight-row">
        <label>Entity type (LLC/Corp) <b id="wEntityVal">25</b></label>
        <input type="range" min="0" max="100" value="25" id="wEntity">
      </div>
      <div class="weight-row">
        <label>Value band fit <b id="wValueVal">25</b></label>
        <input type="range" min="0" max="100" value="25" id="wValue">
      </div>
      <div class="weight-row">
        <label>Owner-occupied <b id="wOccupiedVal">25</b></label>
        <input type="range" min="0" max="100" value="25" id="wOccupied">
      </div>
      <div class="band-row">
        <span>Target property value band</span>
        <input type="number" id="bandMin" value="1000000" step="100000">
        <span>to</span>
        <input type="number" id="bandMax" value="10000000" step="100000">
        <span>— properties inside this range score highest on the value band factor</span>
      </div>
    </div>
  </div>

  <div class="filterbar">
    <select id="filterTerritory"><option value="">All territories</option></select>
    <select id="filterStatus">
      <option value="">All statuses</option>
      <option>New</option><option>Attempted</option><option>Contacted</option>
      <option>Meeting Set</option><option>In Discussion</option><option>Dead</option>
    </select>
    <input type="text" id="searchBox" placeholder="Search owner, address, phone, email...">
    <div class="spacer"></div>
    <span class="count-pill" id="countPill"></span>
  </div>

  <div class="tablewrap" id="tableWrap"></div>

</div>

<div class="overlay" id="overlay" style="display:none;">
  <div class="modal">
    <div class="modal-head">
      <h2 class="display">Map your CSV columns</h2>
      <p>We matched what we could — check each field, then import.</p>
    </div>
    <div class="modal-body">
      <div class="field-block">
        <label>Territory / county tag for this batch</label>
        <input type="text" id="territoryTag" placeholder="e.g. Riverside County">
      </div>
      <div id="mapRows"></div>
    </div>
    <div class="modal-foot">
      <span class="count-pill" id="importPreview"></span>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="cancelImport">Cancel</button>
        <button class="btn btn-primary" id="confirmImport">Import records</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var FIELDS = [
    { key:'ownerName', label:'Owner name', hint:'required', required:true, guesses:['owner name','owner','name','ownername'] },
    { key:'entityType', label:'Entity type', hint:'LLC / Individual / Trust — optional', guesses:['entity','entity type','owner type','ownership type'] },
    { key:'mailingAddress', label:'Mailing address', hint:'optional', guesses:['mailing address','mailing addr','mail address'] },
    { key:'situsAddress', label:'Property address', hint:'optional', guesses:['situs','property address','site address','address'] },
    { key:'apn', label:'APN / parcel #', hint:'used to de-duplicate', guesses:['apn','parcel','parcel number','parcel id'] },
    { key:'phone', label:'Phone', hint:'optional', guesses:['phone','phone number','cell','mobile'] },
    { key:'email', label:'Email', hint:'optional', guesses:['email','email address'] },
    { key:'propertyValue', label:'Property value', hint:'assessed or market value', guesses:['value','assessed value','market value','property value'] },
    { key:'ownerOccupied', label:'Owner-occupied flag', hint:'optional', guesses:['owner occupied','owner-occupied','occupied'] },
    { key:'tenureYears', label:'Ownership tenure (years)', hint:'optional — or map a sale date below', guesses:['tenure','years owned','ownership length','ownership tenure'] },
    { key:'lastSaleDate', label:'Last sale / purchase date', hint:'used if tenure years not provided', guesses:['sale date','purchase date','last sale','last sale date'] }
  ];
  var STATUS_CLASS = { 'New':'st-new','Attempted':'st-attempted','Contacted':'st-contacted','Meeting Set':'st-meeting','In Discussion':'st-discussion','Dead':'st-dead' };

  var state = {
    prospects: [],
    weights: { tenure:25, entity:25, value:25, occupied:25, bandMin:1000000, bandMax:10000000 },
    filters: { territory:'', status:'', search:'' },
    sort: { key:'score', dir:'desc' },
    expanded: {},
    pendingImport: null
  };

  function $(id){ return document.getElementById(id); }
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); }, 2400); }

  // ---------- storage (browser localStorage — data lives only in this browser, this device) ----------
  async function loadState(){
    try{
      var p = localStorage.getItem('cobalt_prospects');
      if(p) state.prospects = JSON.parse(p);
    }catch(e){ state.prospects = []; }
    try{
      var w = localStorage.getItem('cobalt_weights');
      if(w) state.weights = Object.assign(state.weights, JSON.parse(w));
    }catch(e){ /* defaults stand */ }
  }
  async function saveProspects(){
    try{ localStorage.setItem('cobalt_prospects', JSON.stringify(state.prospects)); }
    catch(e){ toast('Could not save — your browser storage may be full or disabled'); }
  }
  async function saveWeights(){
    try{ localStorage.setItem('cobalt_weights', JSON.stringify(state.weights)); }
    catch(e){ /* non-critical */ }
  }

  // ---------- scoring ----------
  function scoreTenure(years){
    if(years==null || isNaN(years)) return 50;
    var capped = Math.min(Math.max(years,0),20);
    return Math.round((capped/20)*100);
  }
  function scoreEntity(type){
    var t = (type||'').toLowerCase();
    if(/llc|inc|corp|co\.|lp\b|ltd/.test(t)) return 100;
    if(/trust/.test(t)) return 70;
    if(/individual|person/.test(t)) return 40;
    return 55;
  }
  function scoreValueBand(value, min, max){
    if(value==null || isNaN(value)) return 50;
    if(value>=min && value<=max) return 100;
    var span = (max-min) || 1;
    var dist = value<min ? (min-value)/span : (value-max)/span;
    return Math.max(Math.round(100 - Math.min(dist*100,100)),0);
  }
  function scoreOccupied(flag){ return flag===true ? 100 : (flag===false ? 0 : 50); }

  function computeScore(rec){
    var w = state.weights;
    var sT = scoreTenure(rec.tenureYears);
    var sE = scoreEntity(rec.entityType);
    var sV = scoreValueBand(rec.propertyValue, w.bandMin, w.bandMax);
    var sO = scoreOccupied(rec.ownerOccupied);
    var totalW = (w.tenure + w.entity + w.value + w.occupied) || 1;
    return Math.round((w.tenure*sT + w.entity*sE + w.value*sV + w.occupied*sO) / totalW);
  }
  function recomputeAllScores(){ state.prospects.forEach(function(r){ r.score = computeScore(r); }); }

  // ---------- csv parsing helpers ----------
  function guessColumn(headers, guesses){
    var lower = headers.map(function(h){ return h.toLowerCase().trim(); });
    for(var i=0;i<guesses.length;i++){
      var idx = lower.indexOf(guesses[i]);
      if(idx>-1) return headers[idx];
    }
    for(var j=0;j<lower.length;j++){
      for(var k=0;k<guesses.length;k++){
        if(lower[j].indexOf(guesses[k])>-1) return headers[j];
      }
    }
    return '';
  }
  function parseBool(v){
    if(v==null) return null;
    var s = String(v).trim().toLowerCase();
    if(['y','yes','true','1','owner occupied'].indexOf(s)>-1) return true;
    if(['n','no','false','0'].indexOf(s)>-1) return false;
    return null;
  }
  function parseMoney(v){
    if(v==null || v==='') return null;
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
    return isNaN(n) ? null : n;
  }
  function inferEntityFromName(name){
    if(!name) return '';
    if(/llc|inc\b|corp|co\.|l\.p\.|ltd|trust/i.test(name)) return /trust/i.test(name) ? 'Trust' : 'LLC/Corp';
    return 'Individual';
  }
  function yearsSince(dateStr){
    var d = new Date(dateStr);
    if(isNaN(d.getTime())) return null;
    return (Date.now() - d.getTime()) / (1000*60*60*24*365.25);
  }

  // ---------- upload flow ----------
  $('uploadBtn').addEventListener('click', function(){ $('fileInput').click(); });
  $('fileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, {
      header:true, skipEmptyLines:true,
      complete:function(results){
        if(!results.data.length){ toast('That file looks empty'); return; }
        openMappingModal(results.meta.fields, results.data);
      },
      error:function(){ toast('Could not read that CSV'); }
    });
    e.target.value = '';
  });

  function openMappingModal(headers, rows){
    state.pendingImport = { headers: headers, rows: rows, mapping: {} };
    var box = $('mapRows');
    box.innerHTML = '';
    FIELDS.forEach(function(f){
      var guess = guessColumn(headers, f.guesses);
      state.pendingImport.mapping[f.key] = guess;
      var row = document.createElement('div');
      row.className = 'map-row';
      var opts = '<option value="">— not in this file —</option>' + headers.map(function(h){
        return '<option value="'+h.replace(/"/g,'&quot;')+'"'+(h===guess?' selected':'')+'>'+h+'</option>';
      }).join('');
      row.innerHTML = '<label>'+f.label+(f.required?' *':'')+'<span>'+f.hint+'</span></label>'+
        '<select data-key="'+f.key+'">'+opts+'</select>';
      box.appendChild(row);
    });
    box.querySelectorAll('select').forEach(function(sel){
      sel.addEventListener('change', function(){
        state.pendingImport.mapping[sel.getAttribute('data-key')] = sel.value;
      });
    });
    $('importPreview').textContent = rows.length + ' rows detected';
    $('territoryTag').value = '';
    $('overlay').style.display = 'flex';
  }
  $('cancelImport').addEventListener('click', function(){ $('overlay').style.display='none'; state.pendingImport=null; });
  $('overlay').addEventListener('click', function(e){ if(e.target.id==='overlay'){ $('overlay').style.display='none'; state.pendingImport=null; } });

  $('confirmImport').addEventListener('click', async function(){
    var pi = state.pendingImport;
    if(!pi) return;
    var m = pi.mapping;
    if(!m.ownerName){ toast('Map an owner name column to continue'); return; }
    var territory = $('territoryTag').value.trim() || 'Unspecified';
    var byKey = {};
    state.prospects.forEach(function(r){ byKey[r.dedupeKey] = r; });

    var added=0, updated=0;
    pi.rows.forEach(function(row){
      var ownerName = (row[m.ownerName]||'').trim();
      if(!ownerName) return;
      var apn = m.apn ? (row[m.apn]||'').trim() : '';
      var mailingAddress = m.mailingAddress ? (row[m.mailingAddress]||'').trim() : '';
      var dedupeKey = apn ? ('apn:'+apn.toLowerCase()) : ('name:'+ownerName.toLowerCase()+'|'+mailingAddress.toLowerCase());

      var entityType = m.entityType ? (row[m.entityType]||'').trim() : '';
      if(!entityType) entityType = inferEntityFromName(ownerName);

      var tenureYears = m.tenureYears ? parseFloat(row[m.tenureYears]) : null;
      if((tenureYears==null || isNaN(tenureYears)) && m.lastSaleDate){
        tenureYears = yearsSince(row[m.lastSaleDate]);
      }

      var fields = {
        ownerName: ownerName,
        entityType: entityType,
        mailingAddress: mailingAddress,
        situsAddress: m.situsAddress ? (row[m.situsAddress]||'').trim() : '',
        apn: apn,
        phone: m.phone ? (row[m.phone]||'').trim() : '',
        email: m.email ? (row[m.email]||'').trim() : '',
        propertyValue: m.propertyValue ? parseMoney(row[m.propertyValue]) : null,
        ownerOccupied: m.ownerOccupied ? parseBool(row[m.ownerOccupied]) : null,
        tenureYears: (tenureYears==null || isNaN(tenureYears)) ? null : Math.round(tenureYears*10)/10,
        territory: territory
      };

      var existing = byKey[dedupeKey];
      if(existing){
        Object.assign(existing, fields);
        updated++;
      } else {
        var rec = Object.assign({
          id: dedupeKey + ':' + Date.now() + Math.random().toString(36).slice(2,7),
          dedupeKey: dedupeKey,
          status: 'New',
          notes: '',
          nextTouchDate: '',
          lastTouchDate: '',
          uploadedAt: new Date().toISOString()
        }, fields);
        byKey[dedupeKey] = rec;
        state.prospects.push(rec);
        added++;
      }
    });

    recomputeAllScores();
    await saveProspects();
    $('overlay').style.display = 'none';
    state.pendingImport = null;
    toast(added+' new, '+updated+' updated');
    renderAll();
  });

  // ---------- weights panel ----------
  var sliderIds = { tenure:'wTenure', entity:'wEntity', value:'wValue', occupied:'wOccupied' };
  Object.keys(sliderIds).forEach(function(key){
    var el = $(sliderIds[key]);
    el.value = state.weights[key];
    el.addEventListener('input', function(){
      state.weights[key] = parseInt(el.value,10);
      $(sliderIds[key]+'Val').textContent = el.value;
      recomputeAllScores();
      renderTable();
      saveWeights();
    });
  });
  $('bandMin').value = state.weights.bandMin;
  $('bandMax').value = state.weights.bandMax;
  ['bandMin','bandMax'].forEach(function(id){
    $(id).addEventListener('change', function(){
      state.weights.bandMin = parseFloat($('bandMin').value)||0;
      state.weights.bandMax = parseFloat($('bandMax').value)||0;
      recomputeAllScores();
      renderTable();
      saveWeights();
    });
  });
  $('panelHead').addEventListener('click', function(){
    $('panelBody').classList.toggle('collapsed');
    $('chev').classList.toggle('open');
  });

  // ---------- filters ----------
  $('filterTerritory').addEventListener('change', function(){ state.filters.territory=this.value; renderTable(); });
  $('filterStatus').addEventListener('change', function(){ state.filters.status=this.value; renderTable(); });
  $('searchBox').addEventListener('input', function(){ state.filters.search=this.value.toLowerCase(); renderTable(); });

  $('clearBtn').addEventListener('click', async function(){
    if(!confirm('This clears every prospect record from this tool permanently. Continue?')) return;
    state.prospects = [];
    await saveProspects();
    renderAll();
    toast('All prospect data cleared');
  });

  // ---------- backup export / import ----------
  $('exportBackupBtn').addEventListener('click', function(){
    if(!state.prospects.length){ toast('Nothing to back up yet'); return; }
    var payload = { exportedAt: new Date().toISOString(), weights: state.weights, prospects: state.prospects };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'cobalt-prospect-backup-'+stamp+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  });

  $('importBackupBtn').addEventListener('click', function(){ $('backupInput').click(); });
  $('backupInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(evt){
      try{
        var payload = JSON.parse(evt.target.result);
        var incoming = Array.isArray(payload) ? payload : payload.prospects;
        if(!Array.isArray(incoming)) throw new Error('bad format');
        var byKey = {};
        state.prospects.forEach(function(r){ byKey[r.dedupeKey] = r; });
        var added=0, updated=0;
        incoming.forEach(function(rec){
          if(!rec.dedupeKey || !rec.ownerName) return;
          var existing = byKey[rec.dedupeKey];
          if(existing){ Object.assign(existing, rec); updated++; }
          else { byKey[rec.dedupeKey]=rec; state.prospects.push(rec); added++; }
        });
        if(payload.weights) state.weights = Object.assign(state.weights, payload.weights);
        recomputeAllScores();
        await saveProspects();
        await saveWeights();
        renderAll();
        toast('Restored: '+added+' added, '+updated+' updated');
      }catch(err){
        toast('That file doesn\'t look like a valid backup');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---------- rendering ----------
  function renderSummary(){
    var total = state.prospects.length;
    var avg = total ? Math.round(state.prospects.reduce(function(s,r){return s+(r.score||0);},0)/total) : 0;
    var today = new Date().toISOString().slice(0,10);
    var due = state.prospects.filter(function(r){ return r.nextTouchDate && r.nextTouchDate<=today && r.status!=='Dead'; }).length;
    var territories = new Set(state.prospects.map(function(r){return r.territory;})).size;
    var meetings = state.prospects.filter(function(r){ return r.status==='Meeting Set' || r.status==='In Discussion'; }).length;
    $('summary').innerHTML = [
      ['Total prospects', total, ''],
      ['Avg score', avg, 'accent'],
      ['Due for touch', due, due>0?'warn':''],
      ['Active conversations', meetings, ''],
      ['Territories', territories, '']
    ].map(function(c){
      return '<div class="cell"><div class="num '+c[2]+'">'+c[1]+'</div><div class="lbl">'+c[0]+'</div></div>';
    }).join('');
  }

  function renderTerritoryOptions(){
    var sel = $('filterTerritory');
    var current = state.filters.territory;
    var territories = Array.from(new Set(state.prospects.map(function(r){return r.territory;}))).sort();
    sel.innerHTML = '<option value="">All territories</option>' + territories.map(function(t){
      return '<option value="'+t+'"'+(t===current?' selected':'')+'>'+t+'</option>';
    }).join('');
  }

  function fmtMoney(v){ if(v==null||isNaN(v)) return '—'; return '$'+Math.round(v).toLocaleString(); }

  function getFilteredSorted(){
    var f = state.filters;
    var rows = state.prospects.filter(function(r){
      if(f.territory && r.territory!==f.territory) return false;
      if(f.status && r.status!==f.status) return false;
      if(f.search){
        var hay = [r.ownerName,r.mailingAddress,r.situsAddress,r.phone,r.email].join(' ').toLowerCase();
        if(hay.indexOf(f.search)===-1) return false;
      }
      return true;
    });
    var key = state.sort.key, dir = state.sort.dir==='asc'?1:-1;
    rows.sort(function(a,b){
      var av=a[key], bv=b[key];
      if(key==='nextTouchDate'){ av=av||'9999'; bv=bv||'9999'; }
      if(typeof av==='string') av=(av||'').toLowerCase();
      if(typeof bv==='string') bv=(bv||'').toLowerCase();
      if(av<bv) return -1*dir;
      if(av>bv) return 1*dir;
      return 0;
    });
    return rows;
  }

  function renderTable(){
    renderSummary();
    renderTerritoryOptions();
    var rows = getFilteredSorted();
    $('countPill').textContent = rows.length + ' of ' + state.prospects.length + ' shown';

    if(!state.prospects.length){
      $('tableWrap').innerHTML = '<div class="empty"><div class="display">No prospects yet</div>'+
        '<p>Upload a CSV export from PropTracer to get started. We\'ll map the columns, score every record, and give you a working list to call from.</p>'+
        '<button class="btn btn-primary" id="emptyUpload">Upload CSV export</button></div>';
      var eb = document.getElementById('emptyUpload');
      if(eb) eb.addEventListener('click', function(){ $('fileInput').click(); });
      return;
    }
    if(!rows.length){
      $('tableWrap').innerHTML = '<div class="empty"><div class="display">No matches</div><p>Nothing matches your current filters.</p></div>';
      return;
    }

    var cols = [
      ['score','Score'],['ownerName','Owner'],['entityType','Entity'],['territory','Territory'],
      ['propertyValue','Value'],['tenureYears','Tenure'],['ownerOccupied','Occ.'],
      ['status','Status'],['nextTouchDate','Next touch'],['','']
    ];
    var today = new Date().toISOString().slice(0,10);
    var html = '<table><thead><tr>' + cols.map(function(c){
      var sorted = state.sort.key===c[0];
      return '<th data-key="'+c[0]+'" class="'+(sorted?'sorted':'')+'">'+c[1]+(sorted?(state.sort.dir==='asc'?' ↑':' ↓'):'')+'</th>';
    }).join('') + '</tr></thead><tbody>';

    rows.forEach(function(r){
      var overdue = r.nextTouchDate && r.nextTouchDate<today && r.status!=='Dead';
      html += '<tr data-id="'+r.id+'">';
      html += '<td><div class="score-cell"><div class="score-bar"><i style="width:'+(r.score||0)+'%"></i></div><span class="score-num">'+(r.score||0)+'</span></div></td>';
      html += '<td><div class="owner-name">'+esc(r.ownerName)+'</div><div class="owner-sub">'+esc(r.situsAddress||r.mailingAddress||'')+'</div></td>';
      html += '<td><span class="badge entity">'+esc(r.entityType||'—')+'</span></td>';
      html += '<td>'+esc(r.territory||'—')+'</td>';
      html += '<td>'+fmtMoney(r.propertyValue)+'</td>';
      html += '<td>'+(r.tenureYears!=null ? r.tenureYears+' yr' : '—')+'</td>';
      html += '<td>'+(r.ownerOccupied===true?'<span class="badge yes">Yes</span>':r.ownerOccupied===false?'<span class="badge no">No</span>':'<span class="badge no">—</span>')+'</td>';
      html += '<td><select class="status-select '+STATUS_CLASS[r.status]+'" data-act="status">' +
        Object.keys(STATUS_CLASS).map(function(s){ return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>'; }).join('') + '</select></td>';
      html += '<td><input type="date" class="touch-date '+(overdue?'overdue':'')+'" data-act="touch" value="'+(r.nextTouchDate||'')+'"></td>';
      html += '<td><div class="row-actions">'+
        '<button class="icon-btn" data-act="expand" title="Notes"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>'+
        '<button class="icon-btn btn-danger" data-act="delete" title="Delete"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>'+
        '</div></td>';
      html += '</tr>';
      if(state.expanded[r.id]){
        html += '<tr class="notes-row" data-id="'+r.id+'"><td colspan="10">'+
          '<div style="font-size:11px;color:var(--ink-faint);margin-bottom:6px;">'+(r.phone?('Phone: '+esc(r.phone)+'  '):'')+(r.email?('· Email: '+esc(r.email)):'')+(r.apn?(' · APN: '+esc(r.apn)):'')+'</div>'+
          '<textarea data-act="notes" placeholder="Call notes, objections, next steps...">'+esc(r.notes||'')+'</textarea>'+
          '<button class="btn btn-primary save-note" data-act="savenote">Save note</button>'+
          '</td></tr>';
      }
    });
    html += '</tbody></table>';
    $('tableWrap').innerHTML = html;
    attachTableHandlers();
  }

  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function attachTableHandlers(){
    document.querySelectorAll('thead th').forEach(function(th){
      th.addEventListener('click', function(){
        var key = th.getAttribute('data-key');
        if(!key) return;
        if(state.sort.key===key){ state.sort.dir = state.sort.dir==='asc'?'desc':'asc'; }
        else { state.sort.key = key; state.sort.dir = key==='score'?'desc':'asc'; }
        renderTable();
      });
    });
    document.querySelectorAll('tbody tr[data-id]').forEach(function(tr){
      var id = tr.getAttribute('data-id');
      var rec = state.prospects.find(function(r){ return r.id===id; });
      if(!rec) return;

      var statusSel = tr.querySelector('[data-act="status"]');
      if(statusSel) statusSel.addEventListener('change', async function(){
        rec.status = this.value;
        if(this.value==='Contacted' || this.value==='Meeting Set' || this.value==='In Discussion'){
          rec.lastTouchDate = new Date().toISOString().slice(0,10);
        }
        await saveProspects();
        renderTable();
      });

      var touchInput = tr.querySelector('[data-act="touch"]');
      if(touchInput) touchInput.addEventListener('change', async function(){
        rec.nextTouchDate = this.value;
        await saveProspects();
        renderTable();
      });

      var expandBtn = tr.querySelector('[data-act="expand"]');
      if(expandBtn) expandBtn.addEventListener('click', function(){
        state.expanded[id] = !state.expanded[id];
        renderTable();
      });

      var delBtn = tr.querySelector('[data-act="delete"]');
      if(delBtn) delBtn.addEventListener('click', async function(){
        if(!confirm('Delete '+rec.ownerName+' from your prospect list?')) return;
        state.prospects = state.prospects.filter(function(r){ return r.id!==id; });
        await saveProspects();
        renderAll();
        toast('Record deleted');
      });

      var saveNoteBtn = tr.querySelector('[data-act="savenote"]');
      if(saveNoteBtn) saveNoteBtn.addEventListener('click', async function(){
        var ta = tr.querySelector('textarea[data-act="notes"]');
        rec.notes = ta.value;
        await saveProspects();
        toast('Note saved');
      });
    });
  }

  function renderAll(){ renderSummary(); renderTerritoryOptions(); renderTable(); }

  // ---------- init ----------
  (async function init(){
    await loadState();
    ['tenure','entity','value','occupied'].forEach(function(key){
      $(sliderIds[key]).value = state.weights[key];
      $(sliderIds[key]+'Val').textContent = state.weights[key];
    });
    $('bandMin').value = state.weights.bandMin;
    $('bandMax').value = state.weights.bandMax;
    recomputeAllScores();
    renderAll();
  })();
})();
</script>
</body>
</html>
